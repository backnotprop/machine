<script>
// machine · launch film, cut 6. One canvas, 1920×1080, 60 fps, 47 s. window.__film = { duration, fps, ready, seek(t) }.
// A real statechart is drawn on an engineering sheet, published into a skill, loaded by five agents whose marks then
// move through the chart as runs: allowed, rejected, waiting on a person, approved, shipped. Then the ledger of runs.
const DURATION = 47, FPS = 60;
const c = document.getElementById('c'), x = c.getContext('2d');
const P = { page: '#0a0a0c', sheet: '#0c0c10', ink: '#ededef', ink2: '#a3a3ad', ink3: '#85858f', ink4: '#4a4a53', g: '#3a3a42', glo: '#26262d', blue: '#3b82f6', bluehi: '#93c2ff', red: '#ff5d62', amber: '#f2b45a', green: '#6ee7a0', node: '#121217', node2: '#17171d' };

const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const text = (s, px, py, { font = MONO(400, 12), color = P.ink3, align = 'left', base = 'middle', alpha = 1, track = 0 } = {}) => { if (alpha <= 0) return; x.save(); x.globalAlpha *= alpha; x.font = font; x.fillStyle = color; x.textAlign = align; x.textBaseline = base; x.letterSpacing = track + 'px'; x.fillText(s, px, py); x.restore(); };
const tw = (s, font) => { x.font = font; return x.measureText(s).width; };

// ---- agent marks: monochrome SVGs tinted per use -------------------------------------------------------------------
const icons = {}, iconPromises = [];
function icon(name, color) { const k = name + color; if (icons[k]) return icons[k]; const im = new Image(); im.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(ICONS[name].replace(/currentColor/g, color)); icons[k] = im; iconPromises.push(new Promise(r => { im.onload = r; im.onerror = r; })); return im; }

const AGENTS = [
  { id: 'claude', name: 'claude code', col: '#e8956a' },
  { id: 'codex', name: 'codex', col: '#ededef' },
  { id: 'gemini', name: 'gemini', col: '#7fb2ff' },
  { id: 'opencode', name: 'opencode', col: '#c9c9d1' },
  { id: 'cursor', name: 'cursor', col: '#b7b7c6' },

// ---- the statechart ------------------------------------------------------------------------------------------------
const Y = 470, NW = 140, NH = 56;
const N = {
  init: { x: 150, y: Y, kind: 'init' },
  plan: { x: 290, y: Y, w: NW, h: NH, label: 'plan' },
  build: { x: 520, y: Y, w: NW, h: NH, label: 'build' },
  verify: { x: 830, y: Y, w: 290, h: 150, label: 'verify', kind: 'parallel', lanes: ['lint', 'types', 'tests'] },
  review: { x: 1120, y: Y, w: NW, h: NH, label: 'review', kind: 'wait' },
  stage: { x: 1345, y: Y, w: NW, h: NH, label: 'stage' },
  canary: { x: 1560, y: Y, w: NW, h: NH, label: 'canary', kind: 'decision' },
  ship: { x: 1800, y: Y, w: 110, h: NH, label: 'ship', kind: 'final' },
  blocked: { x: 830, y: 740, w: 170, h: NH, label: 'blocked', kind: 'final', bad: true },
  rollback: { x: 1560, y: 740, w: NW, h: NH, label: 'rollback' },

for (const k in N) N[k].id = k;
const L = id => N[id].x - N[id].w / 2, R = id => N[id].x + N[id].w / 2, Tp = id => N[id].y - N[id].h / 2, B = id => N[id].y + N[id].h / 2;

const E = [
  { id: 'start', pts: [[N.init.x + 9, Y], [L('plan'), Y]] },
  { id: 'planned', pts: [[R('plan'), Y], [L('build'), Y]], label: 'planned' },
  { id: 'built', pts: [[R('build'), Y], [L('verify'), Y]], label: 'built' },
  { id: 'pass', pts: [[R('verify'), Y], [L('review'), Y]], label: 'all pass' },
  { id: 'approved', pts: [[R('review'), Y], [L('stage'), Y]], label: 'approved', guard: 'human', human: true },
  { id: 'deployed', pts: [[R('stage'), Y], [L('canary'), Y]], label: 'deployed' },
  { id: 'healthy', pts: [[R('canary'), Y], [L('ship'), Y]], label: 'healthy', guard: 'errors<1%' },
  { id: 'fail', pts: [[N.verify.x - 60, B('verify')], [N.verify.x - 60, 610], [N.build.x + 30, 610], [N.build.x + 30, B('build')]], label: 'fail', guard: 'retries < 3', lab: 1, dy: 16 },
  { id: 'exhausted', pts: [[N.verify.x + 60, B('verify')], [N.verify.x + 60, Tp('blocked')]], label: 'fail', guard: 'retries ≥ 3', lab: 0, side: 1, bad: true },

  { id: 'unhealthy', pts: [[N.canary.x, B('canary')], [N.canary.x, Tp('rollback')]], label: 'unhealthy', lab: 0, side: 1 },
  { id: 'rolled', pts: [[L('rollback'), N.rollback.y], [N.build.x, N.rollback.y], [N.build.x, B('build')]], label: 'rolled back', lab: 0, dy: 16 },

// draw order while the chart is being designed

  agents: 16.9, fly: [17.4, 18.4],

  codex:    [[18.0, 'plan'], [19.2, 'edge:planned'], [19.9, 'build'], [30.2, 'edge:built'], [30.9, 'verify'], [34.0, 'edge:fail'], [34.7, 'build']],
  gemini:   [[18.5, 'plan'], [20.0, 'edge:planned'], [20.7, 'build'], [22.4, 'edge:built'], [23.1, 'verify'], [26.2, 'edge:fail'], [26.9, 'build'], [33.2, 'edge:built'], [33.9, 'verify']],
  opencode: [[19.0, 'plan'], [20.8, 'edge:planned'], [21.5, 'build'], [27.6, 'edge:built'], [28.3, 'verify'], [31.6, 'edge:pass'], [32.3, 'review']],
  cursor:   [[19.6, 'plan'], [21.6, 'edge:planned'], [22.3, 'build'], [33.6, 'edge:built'], [34.3, 'verify']],

const REJECT = { who: 'codex', t: 27.2, at: 'build', tried: 'ship' };    // off the map
const WAIT = { who: 'claude', from: 29.7, until: 32.8 };                  // the human gate
const APPROVE = 32.4;
const CAPTIONS = [[0.8, 'State machines for agents.'], [4.6, 'You design the workflow.'], [9.0, 'Every state, every transition, every gate.'], [13.4, 'Publish it. It becomes a skill.'], [16.9, 'Agents load the skill. Every move reports back over MCP.'], [21.5, 'The machine decides what\'s allowed next.'], [24.2, 'The agent decides how.'], [27.0, 'Off the map? Rejected.'], [30.9, 'A human gate? It waits.'], [33.2, 'Determinism where you need it. Emergence where agents shine.'], [36.9, 'Organize your machines. Account for every run.'], [40.5, '']];
const CONSOLE = [
  [17.5, 'claude', 'begin()  →  run_8f2k · plan', 'ink'],
  [18.1, 'codex', 'begin()  →  run_9a1c · plan', 'ink'],
  [18.4, 'claude', 'transition("planned")  ✓ ok  ·  build', 'ok'],
  [19.3, 'codex', 'transition("planned")  ✓ ok  ·  build', 'ok'],
  [21.6, 'claude', 'allowed next: built', 'dim'],
  [24.7, 'claude', 'transition("built")  ✓ ok  ·  verify', 'ok'],
  [26.3, 'gemini', 'transition("fail")  ✓ ok  ·  build  [retries 1/3]', 'ok'],
  [27.3, 'codex', 'transition("ship")  ✗ rejected  ·  "ship" is not an event of build', 'no'],
  [29.1, 'claude', 'transition("all pass")  ✓ ok  ·  review', 'ok'],
  [29.9, 'claude', 'review  ◌ waiting  ·  a person decides', 'wait'],
  [32.5, 'you', 'approved  ·  run_8f2k', 'ok'],
  [34.4, 'claude', 'transition("deployed")  ✓ ok  ·  canary', 'ok'],
  [36.4, 'claude', 'run_8f2k  ·  ship  ◉  done', 'ok'],
];
const CAM = [[0, 960, 500, 1.02], [20.6, 960, 500, 1.02], [22.0, 640, 520, 1.5], [26.3, 640, 520, 1.5], [27.0, 700, 520, 1.5], [29.6, 700, 520, 1.5], [30.6, 1080, 520, 1.5], [32.9, 1080, 520, 1.5], [34.0, 960, 530, 1.02], [36.9, 960, 530, 1.02], [38.4, 960, 540, .94], [47, 960, 540, .94]];
function cam(t) { let k = 0; while (k < CAM.length - 2 && t >= CAM[k + 1][0]) k++; const a = CAM[k], b = CAM[k + 1], p = io(win(t, a[0], b[0])); return { cx: lerp(a[1], b[1], p), cy: lerp(a[2], b[2], p), z: lerp(a[3], b[3], p) }; }

// ---- where is each agent at time t --------------------------------------------------------------------------------
function whereIs(id, t) {
  const r = RUNS[id]; if (t < r[0][0]) return null;
  let k = 0; while (k < r.length - 1 && t >= r[k + 1][0]) k++;
  const [ts, w] = r[k];

// agents sitting in the same node fan out so the marks never stack

  return w;
}

// ---- sheet ----------------------------------------------------------------------------------------------------------
function sheet(t) {
  const a = out(win(t, ...T.sheet));
  x.fillStyle = P.page; x.fillRect(-2000, -2000, 6000, 6000);
  x.save(); x.globalAlpha = a;

  x.fillStyle = '#ffffff';
  for (let gx = 0; gx <= 1920; gx += 24) for (let gy = 0; gy <= 1080; gy += 24) { x.globalAlpha = a * ((gx % 120 === 0 && gy % 120 === 0) ? .16 : .055); x.fillRect(gx - .5, gy - .5, 1, 1); }

  for (let gx = 0; gx <= 1920; gx += 240) { x.beginPath(); x.moveTo(gx + .5, 0); x.lineTo(gx + .5, 1080); x.stroke(); }
  for (let gy = 0; gy <= 1080; gy += 240) { x.beginPath(); x.moveTo(0, gy + .5); x.lineTo(1920, gy + .5); x.stroke(); }
  x.restore();

// ---- drawing the chart ----------------------------------------------------------------------------------------------
function arrow(px, py, ang, col, s = 9) { x.save(); x.translate(px, py); x.rotate(ang); x.fillStyle = col; x.beginPath(); x.moveTo(0, 0); x.lineTo(-s, -s * .5); x.lineTo(-s * .72, 0); x.lineTo(-s, s * .5); x.closePath(); x.fill(); x.restore(); }

  x.save(); x.strokeStyle = col; x.lineWidth = hot ? 2 : 1.6; x.lineJoin = 'round'; x.setLineDash(e.human ? [7, 6] : []);

  if (vert) { const sx = mx + 12 * (e.side || 1); text(e.label, sx, my - (guard ? 8 : 0), { font: MONO(500, 13), color: lab, alpha: la }); if (guard) text(guard, sx, my + 9, { font: MONO(400, 11.5), color: gcol, alpha: la }); }
  else if (e.dy) { const up = e.dy < 0 && guard; text(e.label, mx, my + e.dy - (up ? 15 : 0), { font: MONO(500, 13), color: lab, align: 'center', alpha: la }); if (guard) text(guard, mx, my + e.dy + (up ? 0 : 16), { font: MONO(400, 11.5), color: gcol, align: 'center', alpha: la }); }

      // mini chain: ○ running → ● done

// the gates beat (9.0): guards and the human gate pulse once
const gateBeat = t => { const p = win(t, T.gates, T.gates + 1.4); return p > 0 && p < 1 ? Math.sin(p * Math.PI) : 0; };
