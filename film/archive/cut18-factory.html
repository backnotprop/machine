<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="frames/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block;width:1920px;height:1080px}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="icons.js"></script>
<script>
// machine · launch film, cut 14. One canvas, 1920×1080, 60 fps, 64.6 s. Opens on the GT badge. window.__film = { duration, fps, ready, seek(t) }.
// Quiet lit objects on black. The machine is drawn inside the product's own editor; the page fades and the graph compiles
// into a formal (dark) document the agent can read; the agent reports every move back onto it; inside a state it works its
// own way, moving on goes through the machine; then many runs on many machines, each framed as a skill, each becoming a
// row of the Runs page.
const DURATION = 64.6, FPS = 60;
const c = document.getElementById('c'); let x = c.getContext('2d');
const P = { page: '#09090b', ink: '#ededef', ink2: '#a3a3ad', ink3: '#7d7d87', ink4: '#45454d', bluehi: '#9cc4ff', red: '#ff5d62', amber: '#f2b45a', green: '#6ee7a0', claude: '#e8956a' };
const PAPER = { bg: '#141418', ink: '#ededef', ink2: '#b4b4bc', ink3: '#7d7d87', rule: 'rgba(255,255,255,.14)', code: 'rgba(255,255,255,.05)', blue: '#9cc4ff', amber: '#f2b45a', red: '#ff5d62', row: 'rgba(255,255,255,.05)' };
const SANS = (w, s) => `${w} ${s}px "Geist Sans"`, MONO = (w, s) => `${w} ${s}px "IoskeleyMono"`;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, p) => a + (b - a) * p;
const win = (t, a, b) => clamp((t - a) / (b - a));
const io = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const out = p => 1 - Math.pow(1 - p, 3), oq = p => 1 - Math.pow(1 - p, 5), inq = p => p * p;
const sm = p => p * p * (3 - 2 * p);
// a slow, smooth wander: three incommensurate sines, never a jump
const wander = (u, k = 0) => [Math.sin(u * 1.13 + k) * .6 + Math.sin(u * 2.31 + k * 2) * .3 + Math.sin(u * .47 + k) * .1, Math.cos(u * 1.41 + k) * .6 + Math.cos(u * 2.73 + k * 3) * .3 + Math.cos(u * .61) * .1];
const rr = (px, py, w, h, r) => { x.beginPath(); x.roundRect(px, py, w, h, r); };
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const mix = (h1, h2, p) => { const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16); const ch = s => Math.round(lerp((a >> s) & 255, (b >> s) & 255, p)); return `rgb(${ch(16)},${ch(8)},${ch(0)})`; };
const text = (s, px, py, { font = MONO(400, 12), color = P.ink3, align = 'left', base = 'middle', alpha = 1, track = 0 } = {}) => { if (alpha <= 0) return; x.save(); x.globalAlpha *= alpha; x.font = font; x.fillStyle = color; x.textAlign = align; x.textBaseline = base; x.letterSpacing = track + 'px'; x.fillText(s, px, py); x.restore(); };

// ---- agent marks ---------------------------------------------------------------------------------------------------
const icons = {}, iconPromises = [];
function icon(name, color) { const k = name + color; if (icons[k]) return icons[k]; const im = new Image(); im.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(ICONS[name].replace(/currentColor/g, color)); icons[k] = im; iconPromises.push(new Promise(r => { im.onload = r; im.onerror = r; })); return im; }
function mark(name, color, px, py, s, a = 1) { if (a <= 0) return; const im = icon(name, color); if (!im.complete || !im.naturalWidth) return; const r = im.naturalWidth / im.naturalHeight, w = r >= 1 ? s : s * r, h = r >= 1 ? s / r : s; x.save(); x.globalAlpha *= a; x.drawImage(im, px - w / 2, py - h / 2, w, h); x.restore(); }
const AGENTS = [{ id: 'claude', col: '#e8956a' }, { id: 'codex', col: '#ededef' }, { id: 'gemini', col: '#7fb2ff' }, { id: 'opencode', col: '#c9c9d1' }, { id: 'cursor', col: '#b7b7c6' }, { id: 'amp', col: '#d9b3ff' }, { id: 'goose', col: '#9fe0c0' }];
const AG = Object.fromEntries(AGENTS.map(a => [a.id, a]));
// colours for marks are cached per hex; a blended colour snaps to the nearest of the two it blends
const markCol = (a, b, p) => p < .5 ? a : b;

// ---- the lit objects -------------------------------------------------------------------------------------------------
function pill(px, py, w, h, { r = 14, lit = null, litA = 1, alpha = 1, sweep = -1, hollow = false, shadow = true } = {}) {
  if (alpha <= 0) return; const l = px - w / 2, tp = py - h / 2;
  x.save(); x.globalAlpha *= alpha;
  if (!hollow && shadow) { x.shadowColor = 'rgba(0,0,0,.75)'; x.shadowBlur = 34; x.shadowOffsetY = 16; x.fillStyle = '#0d0d10'; rr(l, tp, w, h, r); x.fill(); x.shadowColor = 'transparent'; }
  const g = x.createLinearGradient(0, tp, 0, tp + h); g.addColorStop(0, hollow ? '#121216' : '#1d1d23'); g.addColorStop(1, hollow ? '#0c0c0f' : '#101014');
  x.fillStyle = g; rr(l, tp, w, h, r); x.fill();
  x.save(); rr(l, tp, w, h, r); x.clip(); const rim = x.createLinearGradient(0, tp, 0, tp + h * .55); rim.addColorStop(0, 'rgba(255,255,255,.28)'); rim.addColorStop(1, 'rgba(255,255,255,0)'); x.strokeStyle = rim; x.lineWidth = 2; rr(l + 1, tp + 1, w - 2, h - 2, Math.max(1, r - 1)); x.stroke();
  if (sweep >= 0) { const sx = l + (w + 240) * sweep - 120; const s = x.createLinearGradient(sx - 110, 0, sx + 110, 0); s.addColorStop(0, 'rgba(255,255,255,0)'); s.addColorStop(.5, 'rgba(255,255,255,.09)'); s.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = s; x.fillRect(l, tp, w, h); }
  x.restore();
  x.strokeStyle = 'rgba(255,255,255,.08)'; x.lineWidth = 1; rr(l + .5, tp + .5, w - 1, h - 1, r); x.stroke();
  if (lit && litA > 0) { x.shadowColor = rgba(lit, .55 * litA); x.shadowBlur = 30; x.strokeStyle = rgba(lit, .85 * litA); x.lineWidth = 1.5; rr(l, tp, w, h, r); x.stroke(); }
  x.restore();
}
function key(px, py, s, agent, { alpha = 1, lift = 0, lit = 0 } = {}) {
  if (alpha <= 0) return; const a = AG[agent], l = px - s / 2, tp = py - s / 2 - lift, d = s * .11, r = s * .22;
  x.save(); x.globalAlpha *= alpha;
  x.shadowColor = 'rgba(0,0,0,.8)'; x.shadowBlur = 40 + lift; x.shadowOffsetY = 18 + lift * .5; x.fillStyle = '#08080a'; rr(l, tp + d, s, s, r); x.fill(); x.shadowColor = 'transparent';
  x.fillStyle = '#121216'; rr(l, tp + d, s, s, r); x.fill();
  const g = x.createLinearGradient(0, tp, 0, tp + s); g.addColorStop(0, '#2c2c34'); g.addColorStop(1, '#16161b'); x.fillStyle = g; rr(l, tp, s, s, r); x.fill();
  x.save(); rr(l, tp, s, s, r); x.clip(); const rim = x.createLinearGradient(0, tp, 0, tp + s * .5); rim.addColorStop(0, 'rgba(255,255,255,.35)'); rim.addColorStop(1, 'rgba(255,255,255,0)'); x.strokeStyle = rim; x.lineWidth = 2.5; rr(l + 1.5, tp + 1.5, s - 3, s - 3, r - 1); x.stroke(); x.restore();
  if (lit > 0) { x.shadowColor = rgba(a.col, .6 * lit); x.shadowBlur = 36; x.strokeStyle = rgba(a.col, .7 * lit); x.lineWidth = 1.5; rr(l, tp, s, s, r); x.stroke(); x.shadowColor = 'transparent'; }

  x.restore();
}
function chip(px, py, agent, { alpha = 1, col = null, r = 15, glow = .6, red = 0 } = {}) {
  if (alpha <= 0) return; const a = AG[agent], cc = col || a.col, ring = red > 0 ? mix(cc, '#ff5d62', red) : cc; x.save(); x.globalAlpha *= alpha; x.shadowColor = rgba(red > .5 ? '#ff5d62' : cc, glow); x.shadowBlur = 20; x.fillStyle = '#0c0c0f'; x.strokeStyle = ring; x.lineWidth = 1.6; x.beginPath(); x.arc(px, py, r, 0, 7); x.fill(); x.stroke(); x.shadowColor = 'transparent'; mark(agent, cc, px, py, r * 1.1, 1 - red); mark(agent, '#ff5d62', px, py, r * 1.1, red); x.restore();
}
const plen = pts => { let s = 0; for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return s; };
const along = (pts, p) => { let d = clamp(p) * plen(pts); for (let i = 1; i < pts.length; i++) { const a = pts[i - 1], b = pts[i], l = Math.hypot(b[0] - a[0], b[1] - a[1]); if (d <= l || i === pts.length - 1) { const q = l ? d / l : 1; return [lerp(a[0], b[0], q), lerp(a[1], b[1], q)]; } d -= l; } return pts[pts.length - 1]; };
function rail(pts, { d = 1, alpha = 1, col = '#5a5a66', bright = 0, dash = null, head = true, lw = 1.4 } = {}) {
  if (alpha <= 0 || d <= 0) return; const total = plen(pts); x.save(); x.globalAlpha *= alpha; x.lineJoin = 'round'; x.lineCap = 'round';
  const path = () => { let left = d * total; x.beginPath(); x.moveTo(...pts[0]); for (let i = 1; i < pts.length && left > 0; i++) { const a = pts[i - 1], b = pts[i], l = Math.hypot(b[0] - a[0], b[1] - a[1]), q = Math.min(1, left / l); x.lineTo(lerp(a[0], b[0], q), lerp(a[1], b[1], q)); left -= l; } };
  if (dash) x.setLineDash(dash);
  if (bright > 0) { x.strokeStyle = rgba(P.bluehi, .18 * bright); x.lineWidth = 9; path(); x.stroke(); }
  x.strokeStyle = bright > 0 ? mix('#5a5a66', '#9cc4ff', bright) : col; x.lineWidth = lw; path(); x.stroke(); x.setLineDash([]);

  x.restore();
}

// ---- the machine ----------------------------------------------------------------------------------------------------
const Y = 540, NW = 150, NH = 58;
const N = {
  triage: { x: 290, y: Y, w: 190, h: NH, label: 'triage issue' },
  build: { x: 540, y: Y, w: NW, h: NH, label: 'build' },
  verify: { x: 840, y: Y, w: 200, h: NH, label: 'verify', glyph: '⫽' },
  review: { x: 1140, y: Y, w: NW, h: NH, label: 'review', kind: 'wait', glyph: '⌂' },
  stage: { x: 1380, y: Y, w: NW, h: NH, label: 'stage' },
  ship: { x: 1620, y: Y, w: 130, h: NH, label: 'ship', kind: 'final' },
  blocked: { x: 840, y: 760, w: 170, h: NH, label: 'blocked', kind: 'final', bad: true },
};
for (const k in N) N[k].id = k;
const L = id => N[id].x - N[id].w / 2, R = id => N[id].x + N[id].w / 2, Tp = id => N[id].y - N[id].h / 2, B = id => N[id].y + N[id].h / 2;
const E = [
  { id: 'triaged', pts: [[R('triage'), Y], [L('build'), Y]], label: 'triaged' },
  { id: 'built', pts: [[R('build'), Y], [L('verify'), Y]], label: 'built' },
  { id: 'pass', pts: [[R('verify'), Y], [L('review'), Y]], label: 'pass' },
  { id: 'approved', pts: [[R('review'), Y], [L('stage'), Y]], label: 'approved', human: true },
  { id: 'deployed', pts: [[R('stage'), Y], [L('ship'), Y]], label: 'deployed' },
  { id: 'fail', pts: [[N.verify.x - 40, B('verify')], [N.verify.x - 40, 660], [N.build.x + 30, 660], [N.build.x + 30, B('build')]], label: 'fail', lab: 1, dy: 18 },
  { id: 'exhausted', pts: [[N.verify.x + 40, B('verify')], [N.verify.x + 40, Tp('blocked')]], label: 'fail ×3', lab: 0, side: 1, bad: true },
  { id: 'changes', pts: [[N.review.x, Tp('review')], [N.review.x, 400], [N.build.x - 30, 400], [N.build.x - 30, Tp('build')]], label: 'changes', human: true, lab: 1, dy: -16 },
];
const EI = Object.fromEntries(E.map(e => [e.id, e]));
const GC = { x: 960, y: 540 };   // the graph's anchor: at home it draws untransformed
const BUILD = ['triage', 'triaged', 'build', 'built', 'verify', 'pass', 'review', 'approved', 'stage', 'deployed', 'ship', 'fail', 'changes', 'blocked', 'exhausted'];
const T0 = 8.8, STEP = .16, tIn = k => { const i = BUILD.indexOf(k); return i < 0 ? 0 : T0 + i * STEP; };
// the describe beat: the prompt is typed, sent, the agent drafts the graph, then one state is moved by hand
const TYPE = [5.9, 8.1], SEND = 8.3, DRAG = [11.4, 12.1], DONE = T0 + 14 * STEP + .5;
const PROMPT = ['Here is our triage issue workflow: triage the issue, build a fix, verify it,', 'a person reviews, stage it, then ship.'];
const bx = t => lerp(1140, 840, io(win(t, DRAG[0], DRAG[1])));   // blocked: where the agent put it, then where the hand puts it

// ---- timeline ------------------------------------------------------------------------------------------------------
const T = {
  logo: [0.5, 5.4],                                   // the badge alone, the voice, then its line; then they give way to the designer
  ui: [5.0, 13.6],                                    // the designer: an empty stage, the conversation floating at its foot; the prompt typed and sent, the graph drafted, one state moved by hand, publish
  compile: [14.2, 15.7], uncompile: [25.6, 27.2],     // the graph moves left and sits beside the page; later it returns to the centre
  doc: [15.0, 22.8], fold: [23.2, 24.6], load: [24.6, 25.8], keyIn: [23.8, 25.0],
  inside: [29.2, 31.8], between: [31.8, 33.2],
  reject: 32.0, wait: [33.8, 35.2], approve: 35.2, cred: 35.4,   // reject: the anchor for the agent's move verify → review (the off-map beat is gone)
  scale: [38.4, 40.2], skills: [45.0, 51.8], runs: [52.4, 54.8],
  brand: 58.6, tag: 60.2, url: 61.2, fade: [63.4, 64.6],
};
const CALLS = [[26.0, 'begin', 'triage'], [27.3, 'transition · triaged', 'build']], FLIGHT = 1.2;
const CAM = [[0, 960, 540, 1], [28.2, 960, 540, 1], [29.4, 690, 560, 1.9], [32.4, 690, 560, 1.9], [33.4, 960, 540, 1], [DURATION, 960, 540, 1]];
function cam(t) { let k = 0; while (k < CAM.length - 2 && t >= CAM[k + 1][0]) k++; const a = CAM[k], b = CAM[k + 1], p = io(win(t, a[0], b[0])); return { cx: lerp(a[1], b[1], p), cy: lerp(a[2], b[2], p), z: lerp(a[3], b[3], p) }; }
// the graph's placement on the floor: centred, or beside the page, or shrunk into the grid of runs
const GRID = { x0: 100, y0: 170, w: 400, h: 220, gap: 40, cols: 4, rows: 3 };
const tile = i => ({ x: GRID.x0 + (i % GRID.cols) * (GRID.w + GRID.gap) + GRID.w / 2, y: GRID.y0 + Math.floor(i / GRID.cols) * (GRID.h + GRID.gap) + GRID.h / 2 });
function gview(t) {
  const uo = sm(win(t, T.ui[1] - .8, T.ui[1] + .2));   // out of the editor's canvas to the centre of the floor
  const side = sm(win(t, ...T.compile)) * (1 - sm(win(t, ...T.uncompile)));
  const small = sm(win(t, ...T.scale)); const home = tile(5);
  let s = lerp(.72, 1, uo), cx = 960, cy = lerp(470, 540, uo);
  s = lerp(s, .55, side); cx = lerp(cx, 470, side); cy = lerp(cy, 520, side);
  s = lerp(s, .235, small); cx = lerp(cx, home.x, small); cy = lerp(cy, home.y - 12, small);
  return { s, cx, cy };
}
const gpt = (g, px, py) => [g.cx + (px - GC.x) * g.s, g.cy + (py - GC.y) * g.s];

function claudeAt(t) {
  if (t < CALLS[0][0] + FLIGHT) return null;
  const dock = n => ({ x: N[n].x, y: Tp(n) - 24, node: n });
  const ride = (e, a, b) => { const [px, py] = along(EI[e].pts, io(win(t, a, b))); return { x: px, y: py, rail: e }; };
  if (t < CALLS[1][0] + FLIGHT) return dock('triage');
  if (t < T.inside[0] - .8) return dock('build');
  if (t < T.between[0]) { const n = N.build, e = sm(win(t, T.inside[0] - .8, T.inside[0] + .4)); const [wx, wy] = wander((t - T.inside[0]) * .8); return { x: lerp(n.x, n.x + wx * 46, e), y: lerp(Tp('build') - 24, n.y + wy * 10, e), node: 'build', roaming: true }; }

  if (t < T.reject + 2.1) return ride('pass', T.reject + 1.4, T.reject + 2.1);
  if (t < T.approve + .9) return dock('review');

// ---- drawing --------------------------------------------------------------------------------------------------------
function floor() { x.fillStyle = P.page; x.fillRect(-3000, -3000, 8000, 8000); const g = x.createRadialGradient(960, 520, 100, 960, 520, 1100); g.addColorStop(0, 'rgba(255,255,255,.035)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(-3000, -3000, 8000, 8000); }
function node(n, t, { lit = null, litA = 1, alpha = 1 } = {}) {
  if (n.id === 'blocked') n = { ...n, x: bx(t) };
  const p = win(t, tIn(n.id), tIn(n.id) + 1.0); if (p <= 0) return;
  const held = n.id === 'blocked' ? sm(win(t, DRAG[0] - .15, DRAG[0])) * (1 - sm(win(t, DRAG[1], DRAG[1] + .2))) : 0;
  const s = lerp(.94, 1, oq(p)) * (1 + .04 * held), a = out(p) * alpha; x.save(); x.translate(n.x, n.y); x.scale(s, s); x.translate(-n.x, -n.y);
  pill(n.x, n.y, n.w, n.h, { r: n.kind === 'final' ? n.h / 2 : 14, lit: lit || (n.kind === 'wait' ? P.amber : n.bad ? P.red : null), litA: lit ? litA : n.kind === 'wait' ? .35 : .3, alpha: a });
  if (n.kind === 'final' && !n.bad) { x.save(); x.globalAlpha *= a; x.strokeStyle = 'rgba(255,255,255,.14)'; x.lineWidth = 1; rr(n.x - n.w / 2 + 6, n.y - n.h / 2 + 6, n.w - 12, n.h - 12, (n.h - 12) / 2); x.stroke(); x.restore(); }
  text((n.glyph ? n.glyph + ' ' : '') + n.label, n.x, n.y + 1, { font: SANS(500, 19), color: n.bad ? rgba(P.red, .9) : P.ink, align: 'center', alpha: a, track: -.2 });
  x.restore();
}
// the edge into blocked follows the state while the hand moves it: an elbow that straightens when it is in place
function exhaustedPts(t) { const x0 = N.verify.x + 40, x1 = bx(t) + 40, y0 = B('verify'), y1 = Tp('blocked'); if (Math.abs(x1 - x0) < .5) return EI.exhausted.pts; const my = (y0 + y1) / 2; return [[x0, y0], [x0, my], [x1, my], [x1, y1]]; }
function edge(e, t, { bright = 0, alpha = 1 } = {}) {
  const d = sm(win(t, tIn(e.id), tIn(e.id) + 1.1)); if (d <= 0) return;
  if (e.id === 'exhausted') e = { ...e, pts: exhaustedPts(t) };
  rail(e.pts, { d, alpha, col: e.bad ? rgba(P.red, .55) : e.human ? rgba(P.amber, .7) : '#4a4a55', bright, dash: e.human ? [6, 7] : null });
  if (!e.label || d < .6) return; const la = win(d, .6, 1) * alpha, i = e.lab ?? 0, a = e.pts[i], b = e.pts[i + 1], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
  if (a[0] === b[0]) text(e.label, mx + 12 * (e.side || 1), my, { font: MONO(400, 12), color: e.bad ? rgba(P.red, .8) : P.ink3, alpha: la });
  else text(e.label, mx, my + (e.dy ?? -14), { font: MONO(400, 12), color: e.human ? rgba(P.amber, .9) : P.ink3, align: 'center', alpha: la });
}
function graph(t, { alpha = 1, lit = {}, brightEdges = {} } = {}) {
  for (const e of E) edge(e, t, { alpha, bright: brightEdges[e.id] || 0 });
  for (const k in N) node(N[k], t, { alpha, lit: lit[k]?.col, litA: lit[k]?.a ?? 1 });
}
// ---- the document the graph becomes ----------------------------------------------------------------------------------------
// a formal page, light, with the real shape of the skill the product renders: frontmatter, the contract, a state card, rules, the states
const PG = { x: 1300, y: 540, w: 760, h: 960 };          // page centre and size
const DOCL = [
  ['hd'],
  ['fm', '---'], ['fm', 'name: auto-triage'], ['fm', 'description: Triage an issue and ship the fix. Use the machine tool to run'], ['fm', '  it; every step is reported and verified against this definition.'], ['fm', '---'],
  ['h1', 'Auto Triage'],
  ['p', 'Machine auto-triage, version 3. The server enforces this definition. This skill is rendered from it.'],
  ['h2', 'The contract'],
  ['th', 'tool', 'arguments', 'returns'],
  ['tr', 'begin', 'machine_id · inputs', 'the first state card'],
  ['tr', 'transition', 'run_id · event · payload', 'the next card, or the rejection'],
  ['tr', 'note', 'run_id · text', 'the card, unchanged'],
  ['tr', 'fail', 'run_id · code · needs', 'the card, now blocked'],
  ['h2', 'A state card'],
